[project]
name = "quiniela-wc2026"

[[services]]
name = "api"
rootPath = "api"

[services.build]
builder = "dockerfile"
dockerfilePath = "Dockerfile"

[services.deploy]
startCommand = "./api"
healthcheckPath = "/health"
healthcheckTimeout = 10

[services.env]
PORT = "8080"

[[services]]
name = "web"
rootPath = "web"

[services.build]
builder = "dockerfile"
dockerfilePath = "Dockerfile"

[services.deploy]
healthcheckPath = "/"
healthcheckTimeout = 10
